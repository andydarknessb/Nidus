[build]
  command = "corepack pnpm install --frozen-lockfile && corepack pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify serves .webmanifest as application/octet-stream; Chrome tolerates it, but say what it is.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
