<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F1F4F9" />
    <script>
      // Sets the mode before the first paint, so a reload never flashes the other one; src/lib/mode.ts keeps it
      // right from there. The Wall paints the mode it last resolved (light when it has none). The phone's pages,
      // under /settings, and the join page, under /join, and the Wall below 768 px wide or 544 px tall (src/lib/home-layout.ts, the phone layout) paint what the phone
      // prefers and never what the Wall stored. A small window is also told it is a phone (data-phone, the `phone:` styles) at
      // the same rule, for the pages the Wall's useHomeLayout does not reach (/settings' sheets); the Wall's hook keeps it from there. The two metas follow, so a dark
      // reload shows no light browser bar until React mounts; their colours are the page colours of src/lib/look.ts
      // (tests/mode.test.ts holds them equal). If anything throws, such as blocked localStorage, nothing more is set
      // and the page is light, which is what index.css draws with no mode.
      (function () {
        try {
          var path = location.pathname;
          var small = typeof innerWidth === 'number' && innerWidth > 0 && (innerWidth < 768 || (typeof innerHeight === 'number' && innerHeight > 0 && innerHeight < 544));
          if (small) document.documentElement.setAttribute('data-phone', '');
          var phone = path === '/settings' || path.indexOf('/settings/') === 0 || path === '/join' || path.indexOf('/join/') === 0 || small;
          var dark = phone ? matchMedia('(prefers-color-scheme: dark)').matches : localStorage.getItem('nidus:mode') === 'dark';
          document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
          var scheme = document.querySelector('meta[name="color-scheme"]');
          var bar = document.querySelector('meta[name="theme-color"]');
          if (scheme) scheme.setAttribute('content', dark ? 'dark' : 'light');
          if (bar) bar.setAttribute('content', dark ? '#0E1016' : '#F1F4F9');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nidus" />
    <title>Nidus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
